name: Evaluation Regression Gate

on:
  pull_request:
    paths:
      - 'apps/agent/prompts/**'
      - 'apps/agent/skills/**'
      - 'apps/agent/engine/**'

jobs:
  eval-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pytz mcp pydantic pytest

      - name: Run PromptEval Studio Ground-Truth Benchmark
        run: |
          python apps/eval-studio/runner.py --version v1.0
